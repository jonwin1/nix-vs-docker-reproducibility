name: "sc-experiment-setup"
include:
    - ../raftly/docker/docker-compose.yml
services:
    scenario-runner:
        profiles: ["scenarios"]
        build:
            context: ..
            dockerfile: docker/Dockerfile.scenarios
        environment:
            RESULTS_DIR: /results
        volumes:
            - ./logs/scenarios:/results
        init: true

    test-runner:
        profiles: ["cluster-tests"]
        build:
            context: ..
            dockerfile: docker/Dockerfile.tests
        environment:
            RESULTS_DIR: /results
        volumes:
            - ./logs/cluster-tests:/results
        networks:
            - raftly
        depends_on:
            - node1
            - node2
            - node3
        init: true
